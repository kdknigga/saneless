{# One-shot load triggers with no interval, so this adds no poll.  The full
   page never sets terminal_reload: it has just rendered history and the
   strip. #}
<div hx-get="/api/jobs/history" hx-target="#history-body" hx-swap="outerHTML" hx-trigger="load" class="htmx-hidden"></div>
<div hx-get="/api/checks" hx-target="#checks-body" hx-swap="outerHTML" hx-trigger="load" class="htmx-hidden"></div>
