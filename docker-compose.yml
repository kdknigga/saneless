# Saneless Docker Compose deployment example
#
# ./config, mounted read-write at /etc/saneless, holds saneless.toml, the one
# place for the paperless-ngx URL and token. SANELESS_ environment variables
# (SANELESS_PAPERLESS__URL and so on) override that file, which is why this
# file sets none of them.

services:
  saneless:
    image: ghcr.io/kdknigga/saneless:0.2.0-rc.7
    # The container port is fixed at 8080; output.web_port does not move it. If
    # 8080 is taken on the host, change the LEFT half -- "8888:8080".
    ports:
      - "8080:8080"
    # The image runs as UID/GID 1000, so on a single-user Linux host this stays
    # commented. If your UID differs, uncomment and edit it, or run
    # `sudo chown -R 1000:1000 ./config` once. A literal, not "${UID}:${GID}":
    # compose leaves UID empty unless your shell exports it, and the container
    # then fails to start for no visible reason.
    # user: "1000:1000"
    volumes:
      # Mount the directory, not the file, and keep it writable: saneless
      # rewrites profiles by renaming a temp file over saneless.toml, and a
      # single-file bind mount makes that rename fail with EBUSY. The server
      # does not create a missing saneless.toml; `saneless auto-profiles` does.
      # See: https://github.com/kdknigga/saneless#configuration
      - ./config:/etc/saneless
      # Durable state: job database and preserved scans. The scratch tmp_dir
      # under /tmp is deliberately not mounted.
      - saneless-data:/var/lib/saneless
      # Optional consume-directory fallback: when the paperless-ngx API cannot
      # be reached, saneless drops the PDF here for paperless-ngx to ingest.
      # Mount its PAPERLESS_CONSUMPTION_DIR and set paperless.consume_dir in
      # saneless.toml to the container path on the right -- the mount on its
      # own does nothing.
      # - /srv/paperless/consume:/consume
    environment:
      # A container's clock reports UTC, so without this every timestamp
      # saneless shows is UTC. Set your own zone.
      - TZ=America/Chicago
      # Commented out ON PURPOSE: ./config/saneless.toml is the one place for
      # the URL and the token. A variable set here OVERRIDES that file
      # silently, and the status strip stays red with nothing to say why.
      # - SANELESS_PAPERLESS__URL=http://paperless:8000
      # - SANELESS_PAPERLESS__TOKEN=your-api-token-here
      # REQUIRED: set this to the machine running saned. A container reaches
      # scanners only over the SANE network protocol, even a USB scanner on
      # this Docker host. For a saned on this host, use host.docker.internal
      # and add  extra_hosts: ["host.docker.internal:host-gateway"]  to the
      # service.
      # - SANELESS_SCANNER__HOST=192.168.1.50
      # Multiple hosts use colons: SANELESS_SCANNER__HOST=192.168.1.50:192.168.1.51
    restart: unless-stopped
    # On SIGTERM, a scan waiting at the flip prompt or for its next page keeps
    # its pages by copying them from /tmp into failed/ on the data volume.
    # saneless waits up to 5 s for the scan worker and up to 60 s more for that
    # copy; Docker's default 10 s grace would kill it half way. A scan busy
    # with anything else keeps its pages in /tmp for the next start of this
    # same container, which `docker compose up -d` does not give it.
    stop_grace_period: 90s

volumes:
  saneless-data:
