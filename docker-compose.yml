# Saneless Docker Compose deployment example
#
# Configuration options:
#   - Volume mount: the ./config directory, mounted read-write at /etc/saneless,
#     holds saneless.toml. That file is the one place for the paperless-ngx
#     token; see the environment: block below for why.
#   - Environment variables: use SANELESS_ prefix with __ nested delimiter
#     (e.g., SANELESS_PAPERLESS__URL, SANELESS_PAPERLESS__TOKEN). Anything set
#     here overrides saneless.toml, which is why this file sets none of them.
#   - Consume directory: optionally mount a host directory for paperless-ngx
#     file-based ingestion as a fallback to API upload

services:
  saneless:
    image: ghcr.io/kdknigga/saneless:latest
    # The container port is fixed at 8080. output.web_port is a bare-metal
    # setting and does not move it; if 8080 is taken on the host, change the
    # LEFT half here -- "8888:8080" -- and leave the right half alone.
    ports:
      - "8080:8080"
    # The image already runs as UID/GID 1000, so on a single-user Linux host --
    # where ./config is 1000:1000 because you created it -- this needs no
    # action and stays commented. Uncomment and edit it only if your own UID
    # differs, or instead run `chown -R 1000:1000 ./config` once. Either way
    # the ./config mount below has to stay writable: saneless rewrites profiles
    # by renaming a temp file over saneless.toml, and it cannot do that in a
    # directory it cannot write. A literal, not "${UID}:${GID}" -- compose does
    # not populate UID unless your shell exports it, and the silent fallback is
    # a container that fails to start for no visible reason.
    # user: "1000:1000"
    volumes:
      # ./config holds saneless.toml. Mount the directory, not the file, and
      # keep it writable: saneless rewrites profiles by writing a temp file
      # beside saneless.toml and renaming it over the original, and a
      # single-file bind mount makes that rename fail with EBUSY.
      # If saneless.toml is missing, saneless starts with defaults plus
      # environment variables and does not create the file.
      # See: https://github.com/kdknigga/saneless#configuration
      - ./config:/etc/saneless
      # Durable state: job database and preserved scans. /tmp/saneless is
      # deliberately NOT mounted -- it is disposable scratch space.
      - saneless-data:/var/lib/saneless
      # Consume-directory fallback, optional. When the paperless-ngx API cannot
      # be reached at all, saneless drops the assembled PDF here instead of
      # failing the scan, and paperless-ngx ingests it once it is back. Mount
      # the directory paperless-ngx consumes (its PAPERLESS_CONSUMPTION_DIR),
      # and set paperless.consume_dir in saneless.toml to the container path on
      # the right -- the mount on its own does nothing.
      # - /srv/paperless/consume:/consume
    environment:
      # A container's clock reports UTC, so without this every timestamp
      # saneless shows -- the job history, the saneless jobs table, the
      # paperless-ngx document title -- is UTC. Set your own zone.
      - TZ=America/Chicago
      # The paperless-ngx connection is commented out ON PURPOSE.
      # ./config/saneless.toml is the one place for the URL and the token. A
      # variable set here OVERRIDES that file silently: saneless would use this
      # value and ignore the token you edited into saneless.toml, and the
      # status strip would stay red with nothing on screen to say why.
      #
      # UPGRADING: earlier versions of this file shipped these two lines live,
      # so your own compose file probably still has them. Delete your
      # SANELESS_PAPERLESS__TOKEN line, or your real saneless.toml stays
      # overridden and the status strip stays red after you fix it.
      #
      # UPGRADING: rename ./config/config.toml to ./config/saneless.toml. The
      # old name is no longer read at all, and until you rename it the status
      # page's first row, Configuration, is red and names the file.
      # - SANELESS_PAPERLESS__URL=http://paperless:8000
      # - SANELESS_PAPERLESS__TOKEN=<your paperless-ngx API token>
      # Uncomment to discover scanners on a remote host via SANE net backend:
      # - SANELESS_SCANNER__HOST=192.168.1.50
      # Multiple hosts use colons: SANELESS_SCANNER__HOST=192.168.1.50:192.168.1.51
    restart: unless-stopped

volumes:
  saneless-data:
