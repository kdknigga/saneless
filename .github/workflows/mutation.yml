# SHAs resolved 2026-09-24 via gh api; comments must carry the full version.
name: Mutation

# Too slow for a merge gate, so it runs weekly and on demand only.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A second run on the same ref waits for the first rather than cancelling it,
# so a long scheduled run is never thrown away by a manual one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SANE development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsane-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      # The hand-written mutants cover what mutmut cannot generate: it skips
      # every function with a decorator other than staticmethod or
      # classmethod. A surviving hand-written mutant fails the job.
      - name: Hand-written mutants
        run: uv run env HOME="$(mktemp -d)" pytest --mutants -m mutant
      # mutmut exits 0 when generated mutants survive: they are findings to
      # read, and the next step lists them.
      - name: Generated mutants
        run: uv run env HOME="$(mktemp -d)" mutmut run
      - name: Surviving mutants
        run: uv run mutmut results
