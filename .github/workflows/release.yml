# SHAs resolved 2026-09-18 via gh api; comments must carry the full version.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only at the workflow level; each job widens its own scope to exactly
# what it publishes with, and no further.
permissions:
  contents: read

jobs:
  # The release gate is the CI workflow itself, called as a reusable workflow,
  # so "green" has one definition and the release path can never drift from the
  # pull-request path. The hand-written test job this replaces was broken three
  # independent ways: it never installed libsane-dev (so `uv sync` could not
  # build python-sane), it synced without the lockfile, and its bare
  # `uv run pytest` collected the browser tests on a runner with no Chromium.
  #
  # Calling CI here pulls its `browser` job into the release path, which costs
  # one Chromium download per release. That is the intended trade.
  #
  # `$/` is GitHub's self-repository reference: it resolves to this repository
  # at the exact commit being run (the tagged one) with no checkout, and it
  # carries no `@ref` suffix by design. It is documented for `jobs.<id>.uses`
  # in the workflow syntax reference and is the recommended form for
  # same-repository composition; the workspace-relative `./` spelling depends
  # on the caller's checked-out workspace instead. Not available on GitHub
  # Enterprise Server, and self-hosted runners need 2.336.0 or newer -- neither
  # applies here.
  #
  # CI reads no secrets, so no `secrets: inherit`. A called workflow's token
  # can only be as narrow as the caller's, so both sides say contents: read.
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  publish-pypi:
    name: publish-pypi
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Object form. Putting the expression inline as a scalar on the same line
    # is rejected at parse time with `Unrecognized named-value`, so the name
    # has to hang off a nested key. One job, one code path,
    # two environments -- which is what the trusted-publisher binding requires,
    # since a pending publisher binds to a single environment name. The manual
    # approval rule lives on `pypi`, so it gates exactly the runs where this
    # expression resolves to `pypi` and leaves rehearsals unblocked.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # This workflow is tag-triggered and publishing, so a cache entry
          # written by a lower-privilege ref must never be restored into it.
          enable-cache: false
          version: "0.12.17"
      # A hyphen in the tag means a pre-release, by semver's own rule. The URL
      # is computed here rather than inlined on the publish step so the action
      # always receives a non-empty value: whether it treats an empty
      # repository-url as "use the default index" is not something this repo
      # has verified, and an explicit URL removes the question entirely.
      - id: index
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://upload.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations, signed with the OIDC identity this job
          # already holds. Supported on both PyPI and TestPyPI.
          attestations: true
          repository-url: ${{ steps.index.outputs.url }}

  publish-docker:
    name: publish-docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # id-token and attestations are what build-provenance needs; without
      # both, the provenance flag below fails at upload time.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/kdknigga/saneless
          # A semver version tag and nothing else. This workflow used to carry
          # an unconditional raw `latest` line, which would have moved the
          # floating tag onto whatever was published most recently -- including
          # a release-candidate rehearsal. The hard constraint is that a
          # rehearsal must never leave GHCR's floating tag, or a plain
          # `pip install saneless`, resolving to a pre-release.
          #
          # Deleting the line is the whole fix: metadata-action's default
          # `flavor: latest=auto` already withholds the floating tag from a
          # semver pre-release and applies it to a final release. Do not
          # reinstate the line with an `enable=` guard -- that restores the
          # exact construct this removes, and adds a condition that then has to
          # stay correct forever.
          #
          # The PyPI half of the same constraint holds structurally rather than
          # by configuration: a pre-release tag only ever reaches TestPyPI, so
          # real PyPI stays empty until the final tag is pushed.
          tags: |
            type=semver,pattern={{version}}
      # `provenance: true` below emits a SLSA attestation, and attestations are a
      # BuildKit feature: they need the docker-container driver. Without this step
      # the build runs on the default docker driver and buildx fails outright with
      # "Attestation is not supported for the docker driver" -- which is exactly how
      # the v0.2.0-rc.1 rehearsal failed, after publish-pypi had already succeeded.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # SLSA build provenance, riding the same OIDC identity. Nothing here
          # is hand-rolled.
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
