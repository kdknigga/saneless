# SHAs resolved 2026-09-24 via gh api; comments must carry the full version.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only at the workflow level; each job widens its own scope to exactly
# what it publishes with, and no further.
permissions:
  contents: read

# One release at a time, in tag order, so an older release cannot finish last
# and leave `latest` on it. An in-flight release is never cancelled, because
# stopping between the image push and the package upload is a half-publish.
# `queue: max` keeps every waiting release; the default queue drops all but
# the newest pending run.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  # The release gate is the CI workflow itself, so "green" has one definition,
  # and the image is built and smoke-tested from this commit before anything
  # is published. `$/` is GitHub's self-repository reference: this repository
  # at the commit being run, with no checkout and no `@ref`. CI reads no
  # secrets, and a called workflow's token can only be as narrow as the
  # caller's, so both sides say contents: read.
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  # The tag and `pyproject.toml` must name the same PEP 440 version, or nothing
  # publishes. The parsed version decides whether this is a pre-release, not
  # the tag's spelling. The script reads the tag from GITHUB_REF_NAME, so no
  # tag text is pasted into a shell command, and `packaging` comes hash-checked
  # from the lockfile's `release` group.
  #
  # The tag must be semver-shaped and spell the version exactly as
  # pyproject.toml does. A non-semver tag is refused: the image tagger would
  # push it under `next` alone, with no version tag, and publish-pypi would
  # follow. A misspelled one would publish an image tag no page names.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A tag-triggered run restores no cache.
          enable-cache: false
      - run: uv sync --locked --only-group release --no-install-project
      - id: gate
        run: uv run --no-sync python scripts/release_gate.py

  publish-docker:
    name: publish-docker
    needs: [ci, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Object form: an inline scalar expression is rejected with
    # `Unrecognized named-value`. The same expression as publish-pypi, so on a
    # final tag the `pypi` approval rule gates the image push and the upload.
    # Only the literal `false` selects `pypi`; a missing gate output falls
    # through to `testpypi`, where an upload can be abandoned.
    environment:
      name: ${{ needs.gate.outputs.is_prerelease == 'false' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      packages: write # push the image, and its attestations beside it
      id-token: write # the OIDC identity the Sigstore signing certificate binds
      attestations: write # store the attestations in GitHub's attestation API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/kdknigga/saneless
          # The exact version on every release, and `X.Y` from final releases
          # only. `latest` comes from the default `flavor: latest=auto`, which
          # withholds it from pre-releases. Never add a raw `latest` line, with
          # or without `enable=`: a release-candidate rehearsal must never
          # leave the floating tag on a pre-release. `next` moves on every
          # release, candidate or final, so it is never behind `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=next
      # The GHA build cache needs the docker-container driver, which the default
      # docker driver lacks.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          # The signed attestations below replace BuildKit's unsigned default
          # provenance manifest.
          provenance: false
          # Reuses the layers CI's docker job smoke-tested in this run. A tag
          # run cannot restore a pull request's cache, so no lower-privilege
          # ref can feed layers into a publish.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Sigstore-signed SLSA build provenance for the pushed digest. Verify with
      # `gh attestation verify oci://<image>:<tag> -R kdknigga/saneless`.
      # Storage records are for organisation-owned repositories only.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kdknigga/saneless
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # An SPDX SBOM of the pushed digest, used only as the input to the
      # attestation below.
      #
      # The action's SHA does not pin the syft it downloads; `syft-version`
      # does, and v1.51.1 is an immutable GitHub release, so every byte this
      # step fetches is fixed. Check that a new syft version is immutable
      # (`gh api repos/anchore/syft/releases/tags/<tag> --jq .immutable`)
      # before moving to it. `github-token` is emptied because syft inherits
      # the action's inputs and this step uploads nothing.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/kdknigga/saneless@${{ steps.build.outputs.digest }}
          syft-version: v1.51.1
          github-token: ""
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # The signed SBOM attestation. Verify with the command above plus
      # `--predicate-type https://spdx.dev/Document/v2.3`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kdknigga/saneless
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

  publish-pypi:
    name: publish-pypi
    # Last: a GHCR tag can be pushed again, a PyPI upload cannot.
    needs: [ci, gate, publish-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job, two environments: a trusted publisher binds to a single
    # environment name, and the approval rule on `pypi` gates only final tags.
    environment:
      name: ${{ needs.gate.outputs.is_prerelease == 'false' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      id-token: write # trusted publishing, and the PEP 740 attestation signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # An irreversible upload restores no cache it does not need.
          enable-cache: false
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations, signed with the OIDC identity this job holds.
          attestations: true
          # Fails toward TestPyPI like the environment. The pypi URL is written
          # out because an empty repository-url's meaning is unverified.
          repository-url: ${{ needs.gate.outputs.is_prerelease == 'false' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
