# SHAs resolved 2026-09-18 via gh api; comments must carry the full version.
name: Docs

on:
  push:
    branches: [master]
  # Pull requests run the same strict build, so a broken nav entry or dead
  # anchor is caught before merge. They never upload or deploy.
  pull_request:

# Published as a Pages artifact, not a pushed branch, so nothing needs a
# writable `contents` scope; only the deploy job widens anything.
permissions:
  contents: read

# Per ref, so a new push to a pull request cancels its stale build and nothing
# else. The deploy has its own `pages` group on the deploy job: a
# workflow-level one would queue pull request builds with deploys, and GitHub
# cancels all but the newest pending run in a group.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # `--no-install-project` skips building saneless, so python-sane is never
      # compiled and this job needs no SANE headers.
      - run: uv sync --locked --only-group dev --no-install-project
      # `--no-sync` is required: a bare `uv run` would install the project,
      # compile python-sane and fail on the missing `sane/sane.h`.
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # Needs Settings -> Pages -> Source: GitHub Actions; a branch source leaves
  # the site empty, because no branch is ever published. Push only, without
  # leaning on the `github-pages` environment's branch policy.
  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: build
    # Never cancel a publish in flight: a half-applied deployment is worse than
    # a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
