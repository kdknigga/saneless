# SHAs resolved 2026-09-24 via gh api; comments must carry the full version.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # `release.yml` calls this workflow, so a release publishes only what has
  # passed exactly the checks a pull request must pass, the browser and docker
  # jobs included. Under that call `github.workflow` is the caller's name and
  # the event is not `pull_request`, so a release run is never cancelled below.
  # This workflow reads no secrets, so no caller needs `secrets: inherit`.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job declares its own token scope: a called workflow's scope can only
  # narrow the caller's, so the reusable call resolves only if each job states
  # what it needs. Every checkout disables credential persistence, so no token
  # is left in `.git/config` for a later step or artifact.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SANE development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsane-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      # .pre-commit-config.yaml is the one definition of the gate; no checker
      # is called by name here, so local hooks and CI cannot drift apart. A
      # fixer that would change a file fails the job and prints the diff.
      # check-added-large-files is inert here: a CI checkout stages nothing.
      - run: uv run prek run --all-files --show-diff-on-failure
      - run: uv run prek run --stage pre-push --all-files --show-diff-on-failure
      # The advisory gate is blocking: a known vulnerability in the lockfile
      # fails the run. tests/test_deployment_config.py rejects `--ignore` (and
      # so `--ignore-until-fixed`) and `continue-on-error`; it does not check
      # scope flags, so keep `--no-dev` and `--no-group` off by hand, because a
      # compromised dev tool runs with a developer's credentials.
      #
      # `--preview-features audit-command` only silences the experimental
      # warning. The audit reaches the OSV API, so it is a CI step, not a hook.
      - run: uv audit --preview-features audit-command

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SANE development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsane-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      # pytest runs with an empty HOME, so a test that touches the real
      # ~/.config or ~/.local/state fails here. uv resolves its cache before
      # `env` runs, under the real HOME.
      #
      # The thread timeout method prints every thread's stack on a hang, then
      # ends the whole run; pyproject.toml's signal method, for local runs,
      # fails only the stuck test but shows only the main thread.
      - name: Test with an empty HOME
        run: uv run env HOME="$(mktemp -d)" pytest -o timeout_method=thread -m "not browser and not sane_hardware"
      # The SANE `test` backend ships with the runtime the headers above pull
      # in, so this step needs no extra apt package.
      - name: SANE test backend with an empty HOME
        run: uv run env HOME="$(mktemp -d)" pytest -o timeout_method=thread -m sane_hardware

  # The browser tests fail any request not addressed to the local test server,
  # so a UI that loads a script or font from a CDN fails here rather than in a
  # user's offline browser.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SANE development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsane-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      # Firefox is for the reload test: only Firefox restores a ticked checkbox
      # on reload, so only it can show the Multiple pages box starts unticked.
      - run: uv run playwright install --with-deps chromium firefox
      # Playwright looks for its browsers under HOME; the shell expands `$HOME`
      # before `env` replaces it, so this names where the step above put them.
      - name: Browser tests with an empty HOME
        run: uv run env HOME="$(mktemp -d)" PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" pytest -o timeout_method=thread -m browser

  # Every pull request builds and smoke-tests the image, and publishing waits
  # for this job. The image is never pushed. Its GHA layer cache is scoped to
  # the ref, so in a release run publish-docker reuses these smoke-tested
  # layers; that cache needs setup-buildx's docker-container driver.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          context: .
          tags: saneless:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runner's system python3 is older than the syntax the script uses.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv run --no-project python scripts/smoke_image.py saneless:ci
