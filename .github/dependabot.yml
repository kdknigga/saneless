# Moves the four kinds of pin this repository holds: SHA-pinned actions,
# digest-pinned base images, uv.lock, and the frozen hook repositories in
# .pre-commit-config.yaml, whose `# frozen: vX.Y.Z` comment Dependabot rewrites
# together with the SHA.
#
# Every entry needs a seven-day cooldown. zizmor enforces that a cooldown is
# present; a test in tests/test_deployment_config.py enforces the seven-day
# floor for every ecosystem, so a new entry needs its own block.
# See docs/explanation/decisions/0015-dependabot-cooldown.md.
#
# The docker ecosystem may also propose bumps to docker-compose.yml's
# reference to this project's own image; answer that with an `ignore:` entry,
# not by dropping the ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
