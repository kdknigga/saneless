[project]
name = "saneless"
version = "0.2.0-rc.6"
description = "SANE scanner to paperless-ngx bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kris Knigga", email = "kris@knigga.com" }
]
requires-python = ">=3.14"
keywords = ["sane", "scanner", "paperless-ngx", "scanning", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "img2pdf>=0.6.3",
    "jinja2>=3.1.6",
    "pikepdf>=10.13.0.post1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-sane>=2.9.2",
    "tomlkit>=0.15.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
saneless = "saneless:main"

[project.urls]
Homepage = "https://github.com/kdknigga/saneless"
Repository = "https://github.com/kdknigga/saneless"
Issues = "https://github.com/kdknigga/saneless/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# anyio 4.15 deprecates `anyio.abc.BlockingPortal`, which starlette's
# `testclient` reads at import, so under `filterwarnings = ["error"]` every
# module importing `TestClient` fails to collect. A constraint, not a
# dependency, keeps the ceiling out of the wheel's metadata. Remove it once
# starlette stops using the alias.
[tool.uv]
constraint-dependencies = ["anyio<4.15"]
# The one declaration of the uv version: setup-uv reads it on every runner and
# local uv refuses to run outside it. The Dockerfile's uv stage and the
# `uv_build` requirement cannot read it, so a test holds both inside this range.
required-version = ">=0.12.18,<0.13"
# python-sane ships only an sdist, and an isolated build would fetch its build
# backend unhashed. The backend is the locked `build` group instead, installed
# with its sha256 checked, and python-sane builds against it with isolation
# off. `build` is a default group so a plain `uv sync` works.
no-build-isolation-package = ["python-sane"]
default-groups = ["dev", "build"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "G", "W", "YTT", "ANN", "ASYNC", "S", "FBT", "A", "COM", "C4", "EM", "ICN", "LOG", "PIE", "Q", "RSE", "RET", "SIM", "TID", "TC", "ARG", "PTH", "FLY", "PERF", "FURB", "RUF", "UP", "D", "I", "PL", "PT", "DTZ", "T20", "FAST"]
ignore = ["E501", "D203", "D212", "W505", "PLR2004", "COM812"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates route annotations at runtime, so ruff must not move their
# names under TYPE_CHECKING. Ruff recognises the receiver only through an
# assignment in the same module: construct the APIRouter or FastAPI where it
# decorates, or the exemption silently stops applying.
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.trace",
    "fastapi.APIRouter.api_route",
    "fastapi.APIRouter.websocket",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.head",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.trace",
    "fastapi.FastAPI.api_route",
    "fastapi.FastAPI.websocket",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

# Ruff formats fenced Python in Markdown, and the planning archive is a record,
# not source. The formatter's `exclude` matches files, so the glob must reach
# them; a bare directory name would exclude nothing.
exclude = [".planning/**/*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is the test mechanism
    "ARG",    # unused args in ABC stubs and fixture overrides
    "S104", "S105", "S106",  # hardcoded test values are inherent to fixtures
    "S603",  # tests start their own interpreter and git with argument lists, never a shell string
]
"src/saneless/__init__.py" = ["PLC0415"]  # main imports the CLI only after blocking SIGPIPE and loading the thread unwinder
"src/saneless/cli.py" = ["PLC0415"]  # serve imports the web stack when it runs, so no other command loads it
"src/saneless/config.py" = ["S104"]  # the web UI listens on every interface by default, as a LAN appliance in a container
# every interpolated fragment is a module constant (the column list, a run of "?"
# placeholders or another SQL constant); every value is a bound parameter
"src/saneless/job.py" = ["S608"]

# Deliberately empty: its presence is the setting. Without it ty keeps
# searching parent directories, so in a worktree nested inside another checkout
# it checks the outer tree and passes whatever this tree contains.
[tool.ty]

[tool.pyrefly]
# "." resolves `tests.*` imports; "src" must come first, or each source file
# also resolves as `src.saneless.*`, a second identity not assignable to the
# first.
search-path = ["src", "."]

# pyrefly hides warnings by default, so a deprecation is an error instead.
[tool.pyrefly.errors]
deprecated = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: Playwright browser tests (requires chromium)",
    "sane_hardware: tests that drive the real SANE test backend (requires libsane-dev)",
    "slow: tests that take tens of seconds; deselect with -m 'not slow' for a quick local run",
    "mutant: re-runs a named test against a mutated copy of the repository; selected only with --mutants",
    "source_structure: reads a module's own source text; mutmut deselects it because its mutated copy is not the real source",
    "real_paperless_transport: keeps the real Paperless HTTP transport instead of the refusing default",
]
addopts = ["-ra"]
strict_markers = true
strict_config = true
xfail_strict = true
filterwarnings = ["error"]
timeout = 60
timeout_method = "signal"
# Some tests report a measurement through `record_property`. Under the default
# "xunit2" family, a `--junitxml` run turns each recorded property into a
# PytestWarning, and `filterwarnings = ["error"]` makes that a test setup
# error. "legacy" carries the properties.
junit_family = "legacy"

# Generated mutants for the delivery path: the pipeline and worker with their
# flip, duplex and start-up profile modules, the Paperless client and the job
# store. mutmut skips functions with a decorator other than staticmethod or
# classmethod, so the hand-written mutants cover the store's locked methods.
# Tests that read a module's own source would see mutmut's rewrite, so the
# source_structure marker deselects them. forkserver is safe with the threads
# the worker tests start.
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/saneless/pipeline.py",
    "src/saneless/worker.py",
    "src/saneless/flip.py",
    "src/saneless/duplex.py",
    "src/saneless/startup_profiles.py",
    "src/saneless/paperless.py",
    "src/saneless/job.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_pipeline.py",
    "tests/test_multi_page_pipeline.py",
    "tests/test_worker.py",
    "tests/test_multi_page_worker.py",
    "tests/test_paperless.py",
    "tests/test_job.py",
    "tests/test_golden_e2e.py",
    "tests/test_outcomes_e2e.py",
    "-m",
    "not browser and not sane_hardware and not source_structure",
]
process_isolation = "forkserver"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
    "prek>=0.5.3",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "uv>=0.12.18",
    "mkdocs-material>=9.7.7",
    "pytest-timeout>=2.4.0",
    "zizmor>=1.30.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
]
# The release workflow installs only this group, hash-checked from the lock,
# to run the version gate before anything is published.
release = [
    "packaging>=26.0",
]
# The build backend python-sane compiles against; see [tool.uv].
build = [
    "setuptools>=84.0.0",
]
