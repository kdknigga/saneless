[project]
name = "saneless"
version = "0.2.0-rc.6"
description = "SANE scanner to paperless-ngx bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kris Knigga", email = "kris@knigga.com" }
]
requires-python = ">=3.14"
keywords = ["sane", "scanner", "paperless-ngx", "scanning", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "img2pdf>=0.6.3",
    "jinja2>=3.1.6",
    "pikepdf>=10.13.0.post1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-sane>=2.9.2",
    "tomlkit>=0.15.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
saneless = "saneless:main"

[project.urls]
Homepage = "https://github.com/kdknigga/saneless"
Repository = "https://github.com/kdknigga/saneless"
Issues = "https://github.com/kdknigga/saneless/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# anyio 4.15.0 turned `anyio.abc.BlockingPortal` into a deprecated alias, and
# starlette's `testclient` module evaluates that name at module scope.  This
# project runs pytest under `filterwarnings = ["error"]`, so the deprecation
# is raised instead of printed, and every module importing `TestClient` fails
# to collect -- seven of them here.  Nothing in this repository can fix that:
# the deprecated name is starlette's own, reached before any saneless code
# runs.  Declaring the ceiling makes resolution refuse the broken combination
# outright, rather than leaving it to be discovered as collection errors once
# a lock has already been written.  `constraint-dependencies` is its right
# home because it bounds what resolution may select without installing anyio
# and without entering `[project].dependencies`, so a ceiling on a package
# saneless never imports stays out of the built wheel's metadata and out of
# every downstream installer.  Remove it once starlette stops using the
# deprecated alias.
[tool.uv]
constraint-dependencies = ["anyio<4.15"]
# The one place this project declares its uv version.  setup-uv reads it on
# every runner, because no workflow step names a version of its own, and local
# uv refuses to run `uv sync`, `uv run` or `uv lock` outside it, so the commit
# hooks, CI and a developer's machine cannot drift apart.  It is a range and
# not an exact pin by choice: a uv patch release reaches CI without review,
# which is accepted in exchange for one declaration instead of eleven, and the
# ceiling still stops a new minor series at review.  Two surfaces cannot read
# it -- the Dockerfile's uv tool stage and the `uv_build` build-system
# requirement -- so they stay pinned, and a test holds both inside this range.
required-version = ">=0.12.18,<0.13"
# python-sane publishes an sdist and no wheel, so every install compiles it,
# and the build backend that does the compiling is code run with the
# installer's privileges.  `uv.lock` does not lock build dependencies, and a
# build constraint pins a version without checking any hash, so left to build
# isolation that backend is resolved fresh at build time and never verified.
# Instead the backend is declared as the locked `build` group, installed from
# the lock with its sha256 checked like any other package, and python-sane is
# built against that installed copy with isolation off.  `build` is a default
# group so a plain `uv sync` works; a sync that leaves the group out fails with
# uv's own hint rather than falling back to an unhashed build.
no-build-isolation-package = ["python-sane"]
default-groups = ["dev", "build"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "B", "G", "W", "YTT", "ANN", "ASYNC", "S", "FBT", "A", "COM", "C4", "EM", "ICN", "LOG", "PIE", "Q", "RSE", "RET", "SIM", "TID", "TC", "ARG", "PTH", "FLY", "PERF", "FURB", "RUF", "UP", "D", "I", "PL", "PT", "DTZ", "T20", "FAST"]
ignore = ["E501", "D203", "D212", "W505", "PLR2004", "COM812"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates a route's annotations at runtime, when the decorator runs,
# so ruff must not move the names they use under TYPE_CHECKING.  Every route
# decorator on both APIRouter and FastAPI is listed, so a route added through
# any of them is covered.  Ruff resolves the receiver (`router`, `app`) only
# through an assignment in the same module, so the APIRouter or FastAPI must be
# constructed in the module that decorates with it; one imported from another
# module is not recognised, and the exemption silently stops applying.
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.trace",
    "fastapi.APIRouter.api_route",
    "fastapi.APIRouter.websocket",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.head",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.trace",
    "fastapi.FastAPI.api_route",
    "fastapi.FastAPI.websocket",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# Keep the formatter out of the planning archive.  That directory is a
# historical record of decisions already made, not source this formatter
# owns, and ruff formats fenced Python blocks inside Markdown, so leaving it
# in scope would rewrite a finished audit trail.  The scope is deliberately
# Markdown under that one directory: `docs/` and `README.md` keep being
# formatted, and so does the one Python file that lives under `.planning/`.
# The glob has to reach the files themselves -- this is the formatter's own
# `exclude`, which matches files rather than directories, so a bare
# directory name here would exclude nothing.  Linting is unaffected: the
# top-level `[tool.ruff] exclude` is not touched, so `.planning/` stays
# linted.
exclude = [".planning/**/*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is the test mechanism
    "ARG",    # unused args in ABC stubs and fixture overrides
    "S104", "S105", "S106",  # hardcoded test values are inherent to fixtures
    "S603",  # tests start their own interpreter and git with argument lists, never a shell string
    "S607",  # git and ruff are resolved on PATH with shutil.which
]
"src/saneless/__init__.py" = ["PLC0415"]
"src/saneless/cli.py" = ["PLC0415"]  # serve imports the web stack when it runs, so no other command loads it
"src/saneless/config.py" = ["S104"]
# identifiers come from the module's column tuple; every value is a bound parameter
"src/saneless/job.py" = ["S608"]

# Deliberately empty: its presence is the setting.  ty skips any
# pyproject.toml without a `[tool.ty]` table and keeps searching parent
# directories, so without it a git worktree nested inside another checkout
# anchors ty on the outer checkout's pyproject.toml.  `ty check` then reports
# on the outer tree's source and passes, whatever this tree contains.
[tool.ty]

[tool.pyrefly]
# "src" must come first. Pyrefly infers a single import root from the project
# layout ("src"), which leaves `tests` unresolvable -- `tests/test_scanner.py`
# imports the shared fake as `tests.fake_sane`: `tests/` is a package, so
# pytest's default prepend mode imports it as `tests.*`. Adding "." alone is
# not the fix: it lets `src/saneless` resolve as both `saneless.*` and
# `src.saneless.*`, and the two identities are not assignable to each other
# (measured: 14 bad-argument-type errors). Listing "src" first pins each
# source file to one module name and leaves "." to resolve `tests` only.
search-path = ["src", "."]

# A deprecated API reported as a warning scrolls past unread: pyrefly hides
# warnings by default, and the `@contextmanager -> Iterator[T]` annotations
# sat there until someone went looking.  Making this kind an error fails the
# hook and CI instead, so a new deprecation gets fixed when it lands rather
# than accumulating.
[tool.pyrefly.errors]
deprecated = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: Playwright browser tests (requires chromium)",
    "sane_hardware: tests that drive the real SANE test backend (requires libsane-dev)",
    "slow: tests that take tens of seconds; deselect with -m 'not slow' for a quick local run",
    "mutant: re-runs a named test against a mutated copy of the repository; selected only with --mutants",
    "source_structure: reads a module's own source text; mutmut deselects it because its mutated copy is not the real source",
    "real_paperless_transport: keeps the real Paperless HTTP transport instead of the refusing default",
]
addopts = ["-ra"]
strict_markers = true
strict_config = true
xfail_strict = true
filterwarnings = ["error"]
timeout = 60
timeout_method = "signal"
# Two tests measure rather than assert -- how many requests an abandoned status
# strip really issues, and how long its poll chain gets -- and report the number
# through `record_property`. pytest's default junit_family, "xunit2", has no
# place to put a per-test property and raises a PytestWarning when one is
# recorded; `filterwarnings = ["error"]` above turns that into a collection
# error, so a `--junitxml` run would fail on the very tests whose output it was
# asked to capture. "legacy" is the family that carries them.
junit_family = "legacy"

# Generated mutants for the delivery path: the pipeline, the worker, the
# Paperless client and the job store.  mutmut never mutates a function that
# carries a decorator other than staticmethod or classmethod, so the store's
# locked public methods get no generated mutants at all; the hand-written
# mutants under tests/mutants cover them instead.  mutmut runs the tests
# against a rewritten copy of each module, so a test that reads a module's own
# source sees the rewrite rather than the real code and fails the clean run;
# those tests carry the source_structure marker and are deselected here.  Each
# mutant runs in a forkserver child, which is safe with the threads the worker
# tests start.
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/saneless/pipeline.py",
    "src/saneless/worker.py",
    "src/saneless/paperless.py",
    "src/saneless/job.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_pipeline.py",
    "tests/test_multi_page_pipeline.py",
    "tests/test_worker.py",
    "tests/test_multi_page_worker.py",
    "tests/test_paperless.py",
    "tests/test_job.py",
    "tests/test_golden_e2e.py",
    "tests/test_outcomes_e2e.py",
    "-m",
    "not browser and not sane_hardware and not source_structure",
]
process_isolation = "forkserver"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
    "prek>=0.5.3",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "uv>=0.12.18",
    "mkdocs-material>=9.7.7",
    "pytest-timeout>=2.4.0",
    "zizmor>=1.30.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
]
# The release workflow installs only this group, hash-checked from the lock,
# to run the version gate before anything is published.
release = [
    "packaging>=26.0",
]
# The build backend python-sane compiles against; see `no-build-isolation-package`
# under [tool.uv] for why it is a locked group rather than a build requirement.
build = [
    "setuptools>=84.0.0",
]
