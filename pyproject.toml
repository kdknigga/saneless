[project]
name = "saneless"
version = "0.1.0"
description = "SANE scanner to paperless-ngx bridge"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Kris Knigga", email = "kris@knigga.com" }
]
requires-python = ">=3.14"
keywords = ["sane", "scanner", "paperless-ngx", "scanning", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "img2pdf>=0.6.3",
    "jinja2>=3.1.6",
    "pillow>=12.1.1",
    "pydantic-settings[toml]>=2.13.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.42.0",
]

[project.scripts]
saneless = "saneless:main"

[project.urls]
Homepage = "https://github.com/kris-knigga/saneless"
Repository = "https://github.com/kris-knigga/saneless"
Issues = "https://github.com/kris-knigga/saneless/issues"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "B", "G", "W", "YTT", "ANN", "ASYNC", "S", "FBT", "A", "COM", "C4", "EM", "ICN", "LOG", "PIE", "Q", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PTH", "FLY", "PERF", "FURB", "RUF", "UP", "D", "I", "PL", "PT", "DTZ", "T20"]
ignore = ["E501", "D203", "D212", "W505", "PLR2004", "COM812"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "TCH", "T201", "PLC0415", "PLR0915", "PLR0912", "PLR0913", "S104"]
"src/saneless/__init__.py" = ["PLC0415"]
"src/saneless/config.py" = ["S104"]

[tool.ty.src]
exclude = ["tests/"]

[tool.pyrefly]
project_excludes = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "prek>=0.3.5",
    "pyrefly>=0.55.0",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
