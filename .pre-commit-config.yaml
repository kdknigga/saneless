# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Git shims installed by `prek install`; worktrees share them via core.hooksPath.
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
# The vendored htmx and Pico files are pinned by SHA-384 `integrity` attributes
# in base.html, so a byte-rewriting hook would make browsers refuse them.
# tests/test_vendor_assets.py is the backstop.
exclude: ^src/saneless/web/static/vendor/
# Hooks with no `stages:` run at commit time only; a file-modifying hook at
# merge or push would abort the operation. A manifest-declared `stages:` wins
# over this, so read the upstream manifest before adding a hook: pre-commit-hooks
# v6.0.0 declares [pre-commit, pre-push, manual] on several, and each one used
# here carries an explicit `stages: [pre-commit]` to pin it back.
default_stages: [pre-commit]

# check-ast and debug-statements parse this source with their own interpreter,
# and anything below 3.14 rejects the bracketless `except A, B:` that
# `ruff format` writes at py314. Pinned by tests/test_deployment_config.py.
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      # Read-only checks, so they can run at all three stages.
      - id: check-ast
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-json
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-symlinks
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-toml
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-vcs-permalinks
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-xml
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: debug-statements
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: detect-aws-credentials
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-merge-commit, pre-push]
      # File-modifying hooks from here down: commit stage only.
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: pretty-format-json
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: https://gitlab.com/bmares/check-json5
    rev: 82381b1133603e4ff6eb3d866ec4501d121b669b  # frozen: v1.0.1
    hooks:
      - id: check-json5

  # Local, so ruff comes hash-checked from uv.lock, the same binary the merge-
  # and push-stage checks run; a remote ruff hook would need a syncing hook that
  # undoes the frozen SHA pins. These are handed the changed files, and
  # `require_serial` stops parallel ruff processes racing on the same files.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      # Commit time checks src/ only, so a TDD RED commit can land; the "(full)"
      # hooks check tests/ at merge and push. These hooks take no filenames, so
      # the paths they cover are the ones in `entry`.
      - id: ty-checker
        name: ty type checker (src)
        entry: uv run ty check src
        language: system
        pass_filenames: false
        always_run: true

      # Paths are named because pyrefly's `use-ignore-files` filters out every
      # file in a gitignored worktree unless files are named on the command
      # line; a directory not named, such as `scripts`, is not checked.
      - id: pyrefly-checker
        name: pyrefly type checker (src)
        entry: uv run pyrefly check src
        language: system
        pass_filenames: false
        always_run: true

      # Any finding fails; findings get fixed, not silenced. The entry is bare
      # on purpose, with no severity floor or persona flag, and CI runs it only
      # through this hook.
      - id: zizmor
        name: zizmor (workflow audit)
        entry: uv run zizmor .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-checker-full
        name: ty type checker (full)
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      - id: pyrefly-checker-full
        name: pyrefly type checker (full)
        entry: uv run pyrefly check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      # Checked, not applied: `--no-fix` and `--check` report without rewriting,
      # so they can run at merge and push.
      - id: ruff-check-full
        name: ruff (no fix)
        entry: uv run ruff check --no-fix .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      # The deployment-config tests only: about two seconds, where the whole
      # suite is CI's job.
      - id: doc-truth-guard
        name: doc-truth harness (naming guard, deployment claims)
        entry: uv run pytest tests/test_deployment_config.py -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

  # Shipped comments, tests, workflows, decision records, CONTRIBUTING.md and
  # the container files state their reasons in words and never cite the
  # planning records, a source line number or the assistant instructions file,
  # none of which a reader can look up. tests/citation_samples.py holds the
  # pattern's own samples, so it is the one exclusion.
  # tests/test_deployment_config.py pins the pattern, scope and exclusion; it
  # picks files by suffix and by name where this hook picks them by type.
  - repo: local
    hooks:
      - id: no-planning-citations
        name: no planning-artefact citations in shipped files, tests and CI
        language: pygrep
        entry: '\b(R[0-9]+-)?(C|D|F|M|N|R|S|U|W|CR|IN|WR)-[0-9]{2,}[a-z]?\b|\b(A|API|APPL|ARCH|CFG|CTR|DARK|DLVR|DOCS|DPLX|ENUM|EXC|HARD|MPG|OUTC|ROBU|SCAN|SCNR|STOR|SWP|TEST)-[0-9]+[a-z]?\b|\b(ARC|CLI|DOC|JOB|OPS|PIP|PPL|SCN|SEC|UI|WEB)-[0-9]{2,}[a-z]?\b|\b(AP|AR|AUDIT|CF|CI|CONF|CORE|DEP|DPI|FW|GAP|GATE|GS|HLTH|HTTP|LOG|NET|OBS|PDF|PIN|PIPE|PKG|PLSS|PROF|PS|RH|TOOL|TQUAL|UIX|XC|P[0-9]+)-[0-9]{2,}[a-z]?\b|\bT-[0-9]+-[0-9]+[a-z]?\b|\bT-[0-9]{2,}[a-z]?\b|\b([Pp]hases?|PHASES?)[ -]?[0-9]+|\b[Pp]lan [0-9]+(\.[0-9]+)?-[0-9]+\b|\bPitfall #?[0-9]+|UI-SPEC|\b(CONTEXT|RESEARCH)\b|\b(PLAN|SUMMARY|VERIFICATION|REVIEW)\.md\b|Open Question|[Pp]er user decision|\.planning/|\.(py|html|css|js):[0-9]+|CLAUDE\.md|\b([Tt]his|[Tt]hat|[Tt]hese|[Tt]hose|[Tt]hree|[Ee]arlier|[Pp]revious|[Pp]rior|[Ll]ater|[Nn]ext|[Ll]ast) phases?\b'
        files: ^(src|scripts|tests|\.github)/|^\.dockerignore$|^docs/explanation/decisions/|^(CONTRIBUTING\.md|Dockerfile|docker-compose\.yml)$
        types_or: [python, html, css, javascript, yaml, dockerignore, dockerfile, markdown]
        exclude: ^tests/citation_samples\.py$
        stages: [pre-commit, pre-merge-commit, pre-push]

      # A fixed pause in a test belongs in conftest's named helpers
      # (quiet_window and browser_quiet_window), so the inline idioms fail here.
      # A net for the common spellings, not a proof: a named Event never set
      # still gets through.
      - id: no-inline-fixed-waits
        name: no inline fixed pauses in tests
        language: pygrep
        entry: 'Event\(\)\.wait\(|wait_for_timeout\('
        files: ^tests/
        exclude: ^tests/conftest\.py$
        types: [python]
        stages: [pre-commit, pre-merge-commit, pre-push]
