# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Git shims installed by `prek install`; worktrees share them via core.hooksPath.
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
# The vendored htmx and Pico files under static/vendor/ are pinned by SHA-384
# `integrity` attributes in base.html, so their bytes must stay exactly as the npm
# registry shipped them. The byte-rewriting hooks below (end-of-file-fixer,
# mixed-line-ending, trailing-whitespace) would append a newline or rewrite line
# endings, the hash would stop matching, and browsers would refuse to load the
# assets. No hook sees the directory; tests/test_vendor_assets.py is the backstop.
exclude: ^src/saneless/web/static/vendor/
# Hooks with no `stages:` of their own run at commit time only, never at merge or
# push, where a file-modifying hook would abort the operation.
#
# It does NOT override a hook whose own manifest declares `stages:` -- a
# manifest-declared value wins over default_stages. pre-commit-hooks v6.0.0 declares
# [pre-commit, pre-push, manual] on check-added-large-files,
# check-executables-have-shebangs, end-of-file-fixer and trailing-whitespace, so each
# of those carries an explicit `stages: [pre-commit]` below to pin it back. The same
# manifest declares it on check-shebang-scripts-are-executable and destroyed-symlinks,
# which this config does not use yet. Read the upstream manifest before adding a hook:
# if it declares `stages:`, the pin here is what keeps it off merge and push.
default_stages: [pre-commit]

# Every hook below whose `language` is python gets its interpreter from here.
# Without this pin prek builds each hook environment with whatever interpreter
# it happens to find, which is not the project's: measured on this machine,
# hook environments existed at 3.12.4, 3.13.9 AND 3.14.2 simultaneously.
#
# That is not a cosmetic inconsistency. `check-ast` and `debug-statements`
# parse this project's source with their OWN interpreter, so a hook built on
# anything below 3.14 rejects syntax that is valid here. PEP 758's bracketless
# `except ValueError, TypeError:` -- which `ruff format` PRODUCES at
# target-version = "py314" -- fails to parse on both 3.12 and 3.13 with
# "SyntaxError: multiple exception types must be parenthesized". The suite
# would then reject code ruff had just written, and the only ways out are a
# suppression or hand-mangling the source, both of which this project forbids.
#
# pinned by tests/test_deployment_config.py
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      # Read-only checks: they report and never rewrite, so nothing here can
      # abort a merge or a push by modifying a file. They run at all three
      # stages deliberately -- check-merge-conflict is worth most at
      # pre-merge-commit, the stage named after the operation it guards, and
      # detect-private-key and detect-aws-credentials at pre-push, the last
      # point before content leaves the machine.
      - id: check-ast
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-json
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-merge-conflict
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-symlinks
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-toml
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-vcs-permalinks
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-xml
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: debug-statements
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: detect-aws-credentials
        stages: [pre-commit, pre-merge-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-merge-commit, pre-push]
      # File-modifying hooks from here down: commit stage only.
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: pretty-format-json
      # No sort-simple-yaml: upstream declares `files: '^$'`, a pattern that
      # matches nothing, so the hook can only ever run against a `files:` this
      # config supplies itself. There is no YAML here whose keys we want sorted
      # -- ordering is meaningful in this file and in the workflows -- so it is
      # absent rather than configured.
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: https://gitlab.com/bmares/check-json5
    rev: 82381b1133603e4ff6eb3d866ec4501d121b669b  # frozen: v1.0.1
    hooks:
      - id: check-json5

  # The commit-stage lint fixer and formatter. They are local rather than
  # fetched from a hook repository so that ruff comes from uv.lock, hash-checked
  # and at the exact version the project resolves, the same binary the
  # merge- and push-stage checks below run. A remote ruff hook would carry a
  # second, separately pinned copy, and keeping that copy in step with the lock
  # needs a syncing hook, which rewrites a frozen commit SHA back to its tag and
  # so undoes the pin every remote repo above carries.
  #
  # They sit in their own block because they work the other way round from
  # the whole-tree checkers in the next one: these are handed the changed
  # files and filter them by type, so a commit touching no Python skips them.
  # `require_serial` keeps prek from splitting the file list across parallel
  # ruff processes that would race to rewrite the same files.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      # Commit time checks src/ only, so a TDD RED commit (a test naming a symbol
      # that does not exist yet) can land. tests/ is checked in full when the
      # branch is merged with --no-ff or pushed, by the two "(full)" hooks below.
      #
      # No `types:` on any hook in this section, deliberately. Each one pairs
      # `always_run: true` with `pass_filenames: false`, so it runs whatever
      # changed and is handed no filenames -- a `types:` filter would have
      # nothing to act on, and would only suggest a scoping that is not there.
      # The paths these checkers cover are the ones written into `entry`.
      - id: ty-checker
        name: ty type checker (src)
        entry: uv run ty check src
        language: system
        pass_filenames: false
        always_run: true

      # Paths are explicit rather than relying on `project-includes`: pyrefly's
      # `use-ignore-files` is on by default and is only bypassed when files are
      # named on the command line.  Without them, a checkout inside a gitignored
      # directory (a `.claude/worktrees/` git worktree) has every source file
      # filtered out and the hook fails with "No Python files matched".  The
      # full hook below names `scripts` for the same reason: a directory that
      # is not named is not checked at all, so the release scripts would pass
      # the gate unexamined.
      - id: pyrefly-checker
        name: pyrefly type checker (src)
        entry: uv run pyrefly check src
        language: system
        pass_filenames: false
        always_run: true

      # The workflow audit, at commit stage with the other cheap checks: it
      # reads five files, finishes in well under a second, and never rewrites
      # anything, so it cannot abort an operation by modifying the tree. Any
      # finding exits non-zero, which is the whole contract -- findings get
      # fixed, not silenced with an inline audit-ignore comment. The entry is
      # bare on purpose: no severity or confidence floor and no persona flag,
      # because the default `regular` persona is the contract. CI runs this
      # hook through prek, so this entry is the only spelling of the audit.
      - id: zizmor
        name: zizmor (workflow audit)
        entry: uv run zizmor .
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-checker-full
        name: ty type checker (full)
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      - id: pyrefly-checker-full
        name: pyrefly type checker (full)
        entry: uv run pyrefly check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      # Lint and format are checked, not applied, at merge and push. The
      # commit-stage ruff fixer and formatter in the block above rewrite files,
      # so they cannot run at either stage -- which would leave the two cheapest
      # checks in the gate deferred to a CI round trip while the two slowest
      # (the type checkers) ran locally. `--no-fix` and `--check` report
      # instead of rewriting, so they can.
      - id: ruff-check-full
        name: ruff (no fix)
        entry: uv run ruff check --no-fix .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

      # The doc-truth harness -- the naming guard and the deployment claims it
      # asserts -- gets its own gate here, at merge and push. Until this hook
      # existed there was no pytest hook anywhere in this file, so the guard's
      # only enforcement points were CI and whatever a developer chose to run
      # locally; this adds the third. Scoped to the one file the guard lives in
      # rather than the whole suite: about two seconds instead of twenty-seven,
      # and the rest of the suite is already CI's job.
      - id: doc-truth-guard
        name: doc-truth harness (naming guard, deployment claims)
        entry: uv run pytest tests/test_deployment_config.py -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit, pre-push]

  # Comments and docstrings state their reasons in words. They never point at
  # the planning records (decision, finding and requirement IDs, phase and plan
  # numbers, the planning file names), because those records do not ship and a
  # reader cannot look the reference up. That holds for the package under src/,
  # the release scripts under scripts/ that the workflows send a reader into,
  # the tests, the workflows under .github/ and .dockerignore. pygrep fails the
  # hook on any matching line in those files.
  #
  # This block is separate from the local block above because it works the
  # other way round: those hooks run whole-tree checkers with no filenames,
  # while this one is handed the files and filters them by path and type, so it
  # only ever reads Python, templates, CSS, JavaScript, YAML and .dockerignore.
  # The top-level exclude keeps the vendored assets out. The one file this hook
  # excludes is tests/citation_samples.py: it holds the pattern and the sample
  # identifiers the guard's own tests need, which cannot be written anywhere
  # this hook reads. There is no baseline. Read-only, so it runs at all three
  # stages. tests/test_deployment_config.py imports the same pattern, scans the
  # same files in CI, and asserts that the pattern, the scope and the single
  # exclusion stay as written here. The test picks files by suffix where this
  # hook picks them by type, so a Python script with no .py suffix would be
  # checked here and not there.
  - repo: local
    hooks:
      - id: no-planning-citations
        name: no planning-artefact citations in shipped files, tests and CI
        language: pygrep
        entry: '\b(R[0-9]+-)?(C|D|M|N|S|U|W|CR|IN|WR)-[0-9]{2,}\b|\b(A|API|APPL|ARCH|CFG|CTR|DARK|DLVR|DOCS|DPLX|ENUM|EXC|HARD|MPG|OUTC|ROBU|SCAN|SCNR|STOR|SWP|TEST)-[0-9]+\b|\bT-[0-9]+-[0-9]+\b|\b[Pp]hase [0-9]+|\b[Pp]lan [0-9]+(\.[0-9]+)?-[0-9]+\b|\bPitfall #?[0-9]+|UI-SPEC|\b(CONTEXT|RESEARCH)\b|\b(PLAN|SUMMARY|VERIFICATION|REVIEW)\.md\b|Open Question|[Pp]er user decision|\.planning/'
        files: ^(src|scripts|tests|\.github)/|^\.dockerignore$
        types_or: [python, html, css, javascript, yaml, dockerignore]
        exclude: ^tests/citation_samples\.py$
        stages: [pre-commit, pre-merge-commit, pre-push]

      # tests/ruff.toml bans time.sleep in tests, but a thread can pause just as
      # well on an Event nobody sets, and a browser test can pause on the page's
      # wait_for_timeout; the ban sees neither. A fixed pause, threaded or in
      # the browser, belongs in conftest's named helpers (quiet_window and
      # browser_quiet_window), where it can be found by name, so the one-line
      # idiom for either inline pause fails here. conftest holds those helpers,
      # so it is the one file excluded. It is a net for the common spellings,
      # not a proof: a named Event that is never set still gets through, and
      # review has to catch it.
      - id: no-inline-fixed-waits
        name: no inline fixed pauses in tests
        language: pygrep
        entry: 'Event\(\)\.wait\(|wait_for_timeout\('
        files: ^tests/
        exclude: ^tests/conftest\.py$
        types: [python]
        stages: [pre-commit, pre-merge-commit, pre-push]
